# GitLab CI/CD pipeline for the NGINX Nyan Cat website.

variables:
  # The fully qualified image name pushed to the GitLab Container Registry.
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  CONTAINER_TAG: "$CI_COMMIT_SHORT_SHA"

stages:
  - test
  - build
  - push
  - deploy

# Repo-structure lint that runs anywhere with `gitlab-ci-local` — no Docker-in-Docker,
# no registry credentials needed. Verifies the files the pipeline builds/deploys are
# present and well-formed so CI wiring can be validated locally before pushing.
lint-workflow:
  stage: test
  image: alpine:latest
  script:
    - apk add --no-cache bash grep sed
    # Fail fast if expected artifacts are missing or malformed.
    - test -f Dockerfile && echo OK-Dockerfile-present
    - test -f .gitlab-ci.yml && echo OK-pipeline-file-present
    - test -f www/index.html && echo OK-website-present
    - grep -q 'FROM nginx' Dockerfile || { echo "Dockerfile does not build NGINX"; exit 1; }
    - grep -qi 'Nyan Cat' www/index.html || { echo "index.html missing Nyan Cat content"; exit 1; }
    - grep -qi 'youtube.com/embed' www/index.html || { echo "index.html missing embedded video iframe"; exit 1; }

# Build the Docker image from the Dockerfile using Kaniko (rootless friendly).
build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    # Authenticate Kaniko against the GitLab Container Registry.
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    # Single line on purpose: backslash continuations fold a leading space into the
    # flags, which Cobra reads as an unknown subcommand ("unknown command ' --context'").
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "$IMAGE_NAME:$CONTAINER_TAG"

# Push a `latest` tag in addition to the commit SHA tag.
push-image:
  stage: push
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    # Single line on purpose (see build-image above).
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "$IMAGE_NAME:$CONTAINER_TAG" --destination "$IMAGE_NAME:latest"

# Placeholder for deploying to Rancher. Adjust the job to your environment.
# The most common approaches are documented in README.md under "Deploy".
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Configure this job with `kubectl` or the Rancher CLI to roll out $IMAGE_NAME:$CONTAINER_TAG"
